name: render-remotion
on:
  push:
    branches: [remotion-build]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependensi sistem (Chrome headless + ffmpeg)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -y -qq"
          for i in 1 2 3; do timeout 120 $APT update && break || echo "apt update retry $i"; done
          for i in 1 2; do timeout 240 $APT install ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 && break || echo "apt install retry $i"; done
          timeout 120 $APT install libasound2t64 || timeout 120 $APT install libasound2 || true
      - run: bash build_reel.sh
      - name: Publish ke branch output
        run: |
          BR="$(node -e "console.log(require('./job/meta.json').publishBranch||'reel-remotion')")"
          cd pub
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reel.mp4 cover.jpg timing.json
          git commit -q -m "reel from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BR"
