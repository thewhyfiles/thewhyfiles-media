:root{--ink:#171717;--paper:#F2F0E9;--blue:#536DFF;--grey:#A7A7A2;--lgrey:#D9D9D5}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:var(--ink)}
#c{position:absolute;left:0;top:0;width:720px;height:1280px}
#ov{position:absolute;left:0;top:0;width:720px;height:1280px;overflow:hidden}
#vig{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(23,23,23,.55) 0%,rgba(23,23,23,0) 16%),radial-gradient(ellipse 85% 60% at 50% 37%,rgba(23,23,23,0) 40%,rgba(23,23,23,.78) 100%),linear-gradient(to bottom,rgba(23,23,23,0) 58%,rgba(23,23,23,.9) 76%,rgba(23,23,23,.95) 100%)}
#wm{position:absolute;top:150px;left:0;right:0;text-align:center;font:500 22px Inter;letter-spacing:.06em;color:var(--paper);opacity:.5}

.chip{position:absolute;left:0;top:0;transform-origin:50% 100%;font:800 29px Sora;letter-spacing:.02em;padding:11px 20px 12px;border-radius:13px;background:var(--blue);color:var(--paper);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;line-height:1.1}
.chip::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--blue);border-bottom:0}
.chip.paper{background:var(--paper);color:var(--ink)}
.chip.paper::after{border-top-color:var(--paper)}

#tagwrap{position:absolute;left:0;right:0;top:430px;text-align:center}

#tag{font:400 84px/1.08 'DM Serif Display';color:var(--paper)}

#en{font:400 26px Inter;color:var(--grey);margin-top:28px}

#fade{position:absolute;inset:0;background:#000;opacity:0}

<div id="ov">

  <div id="end"><div id="tagwrap"><div id="bar"></div><div id="tag">Setiap hal<br>punya <em>alasan.</em></div><div id="en">Everything has a reason.</div><div id="handle">@thewhyfiles.id</div></div></div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=720,H=1280;
const BLUE=0x536dff,PAPER=0xf2f0e9,INK=0x171717,LGREY=0xd9d9d5;
const TL=await (await fetch('timeline.json')).json();
await Promise.all([document.fonts.load('700 46px Sora'),document.fonts.load('800 29px Sora'),document.fonts.load('400 23px Inter'),document.fonts.load('500 22px Inter'),document.fonts.load('400 84px "DM Serif Display"')]);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(u,a,b)=>clamp((u-a)/(b-a));

// ---------- renderer ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(INK);scene.fog=new THREE.Fog(INK,14,34);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.5;
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,80);
cam.setViewOffset(W,H,0,150,W,H);

const sun=new THREE.DirectionalLight(0xffe9d0,2.5);sun.position.set(5,9,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:34});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.025;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xc4ccff,0x1c1b19,0.35));

// ---------- textures ----------
function rngMaker(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function sandTex(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#24221f';g.fillRect(0,0,512,512);const r=rngMaker(11);
  for(let i=0;i<9000;i++){const v=Math.floor(30+r()*40);g.fillStyle=`rgba(${v+4},${v+1},${v-4},${.2+r()*.4})`;const s=1+r()*2.2;g.fillRect(r()*512,r()*512,s,s);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,10);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function stoneCanvas(rows,cols,base,line){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,512,512);const r=rngMaker(5);
  for(let i=0;i<6000;i++){const v=r()>.5?255:0;g.fillStyle=`rgba(${v},${v},${v},${.03+r()*.05})`;g.fillRect(r()*512,r()*512,2,2);}
  g.strokeStyle=line;g.lineWidth=4;const rh=512/rows,cw=512/cols;
  for(let y=0;y<=rows;y++){g.beginPath();g.moveTo(0,y*rh);g.lineTo(512,y*rh);g.stroke();
    for(let x=0;x<cols;x++){const xx=(x+(y%2?.5:0))*cw;g.beginPath();g.moveTo(xx,y*rh);g.lineTo(xx,(y+1)*rh);g.stroke();}}
  return c;}
const stoneC=stoneCanvas(3,6,'#7f7a70','#57534b');
const sand=sandTex();
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({map:sand,roughness:1,metalness:0}));
floor.receiveShadow=true;scene.add(floor);

// ---------- step pyramid (6 tiers) ----------
const NT=6,B=3.2,TOP=1.1,TH=.34;
const tw=i=>lerp(B,TOP,i/(NT-1));
const tiers=[],tierMats=[];
for(let i=0;i<NT;i++){const w=tw(i);
  const tex=new THREE.CanvasTexture(stoneC);tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(Math.max(1,Math.round(w*1.6)),1);tex.anisotropy=8;
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.92,metalness:0,transparent:true,opacity:1});tierMats.push(mat);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,TH,w),mat);m.castShadow=m.receiveShadow=true;scene.add(m);tiers.push(m);}
const tierY=i=>TH*(i+.5);
const STEP_H=TH*NT;
const centroidY=(()=>{let s=0,m=0;for(let i=0;i<NT;i++){const a=tw(i)**2;s+=a*tierY(i);m+=a}return s/m})();

// ---------- smooth (Giza) pyramids ----------
const GB=3.3,GH=2.1;
const gTexC=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#7a756a';g.fillRect(0,0,512,512);
  const r=rngMaker(9);for(let i=0;i<7000;i++){const v=r()>.5?255:0;g.fillStyle=`rgba(${v},${v},${v},${.03+r()*.05})`;g.fillRect(r()*512,r()*512,2,2);}
  g.strokeStyle='rgba(70,66,58,.5)';g.lineWidth=2;for(let y=0;y<512;y+=22){g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke()}return c})();
function giza(scale){const tex=new THREE.CanvasTexture(gTexC);tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.88,metalness:0,transparent:true,opacity:1,flatShading:true});
  const geo=new THREE.ConeGeometry(GB/Math.SQRT2,GH,4,1);geo.rotateY(Math.PI/4);geo.translate(0,GH/2,0);
  const m=new THREE.Mesh(geo,mat);m.castShadow=m.receiveShadow=true;m.scale.setScalar(scale);scene.add(m);return m;}
const gMain=giza(1),gSecond=giza(.95),gThird=giza(.5);
gSecond.position.set(-4.2,0,-5.5);gThird.position.set(3.8,0,-7.5);

// ---------- helper visuals ----------
const blueBasic=(op=1)=>new THREE.MeshBasicMaterial({color:BLUE,transparent:true,opacity:op,toneMapped:false,depthWrite:false});
const paperBasic=(op=1)=>new THREE.MeshBasicMaterial({color:PAPER,transparent:true,opacity:op,toneMapped:false,depthWrite:false});
function frame(outer,inner,mat){const s=new THREE.Shape();s.moveTo(-outer,-outer);s.lineTo(outer,-outer);s.lineTo(outer,outer);s.lineTo(-outer,outer);s.closePath();
  if(inner>0){const p=new THREE.Path();p.moveTo(-inner,-inner);p.lineTo(-inner,inner);p.lineTo(inner,inner);p.lineTo(inner,-inner);p.closePath();s.holes.push(p);}
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s).rotateX(-Math.PI/2),mat);m.renderOrder=5;scene.add(m);return m;}
// terrace highlights (top of each tier)
const terr=[];for(let i=0;i<NT;i++){const o=tw(i)/2+.012,inn=o-.075;const f=frame(o,inn,blueBasic(1));f.position.y=TH*(i+1)+.004;terr.push(f)}
// ground ring around the base
const baseRing=frame(B/2+.2,B/2+.1,blueBasic(1));baseRing.position.y=.01;
const baseGlow=frame(B/2+.45,B/2+.2,blueBasic(.2));baseGlow.position.y=.008;
const gRing=frame(GB/2+.2,GB/2+.1,blueBasic(1));gRing.position.y=.01;
// height bar
const hbar=new THREE.Group();{const m=blueBasic(1);const bar=new THREE.Mesh(new THREE.BoxGeometry(.045,1,.045).translate(0,.5,0),m);bar.name='bar';hbar.add(bar);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(.32,.045,.045),m);cap.name='cap';hbar.add(cap);const foot=new THREE.Mesh(new THREE.BoxGeometry(.32,.045,.045),m);hbar.add(foot);scene.add(hbar);}
function setHBar(x,z,h,ry=0){hbar.visible=h>.02;hbar.position.set(x,0,z);hbar.rotation.y=ry;hbar.getObjectByName('bar').scale.y=Math.max(h,1e-3);hbar.getObjectByName('cap').position.y=h;}
// arrows
const arrows=[];
function mkArrow(){const g=new THREE.Group();const mat=blueBasic(1);mat.depthTest=false;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(.14,.3,24).rotateX(Math.PI).translate(0,.15,0),mat);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1,16).translate(0,.5,0),mat);shaft.name='s';g.add(cone);g.add(shaft);g.userData.mat=mat;g.renderOrder=9;cone.renderOrder=shaft.renderOrder=9;scene.add(g);return g;}
for(let k=0;k<9;k++)arrows.push(mkArrow());
// arrow tip at p, pointing along dir (unit), shaft length L
function setArrow(a,p,dir,L,op=1){a.visible=op>0.01;a.position.copy(p);a.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir.clone().normalize());
  const s=a.getObjectByName('s');s.position.y=.28;s.scale.y=Math.max(L,1e-3);a.userData.mat.opacity=op;}
// centroid sphere
const cog=new THREE.Mesh(new THREE.SphereGeometry(.17,32,16),new THREE.MeshBasicMaterial({color:BLUE,toneMapped:false,depthTest:false,transparent:true}));cog.renderOrder=10;scene.add(cog);
const cogHalo=new THREE.Mesh(new THREE.SphereGeometry(.32,32,16),new THREE.MeshBasicMaterial({color:BLUE,toneMapped:false,depthTest:false,transparent:true,opacity:.25,depthWrite:false}));cogHalo.renderOrder=10;scene.add(cogHalo);
// stone test pieces (scene 5)
const testTex=new THREE.CanvasTexture(stoneC);testTex.colorSpace=THREE.SRGBColorSpace;
const testMat=new THREE.MeshStandardMaterial({map:testTex,roughness:.92});
const cube=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),testMat);cube.castShadow=cube.receiveShadow=true;scene.add(cube);
const posts=[-1,1].map(s=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.5,1.1,.6),testMat);m.position.set(s*1.45,.55,0);m.castShadow=m.receiveShadow=true;scene.add(m);return m});
const halves=[-1,1].map(s=>{const piv=new THREE.Group();piv.position.set(s*1.7,1.1,0);const m=new THREE.Mesh(new THREE.BoxGeometry(1.7,.26,.5),testMat);m.position.set(-s*.85,.13,0);m.castShadow=m.receiveShadow=true;piv.add(m);scene.add(piv);return piv});
const weight=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),new THREE.MeshStandardMaterial({color:0x5d5a54,roughness:.6,metalness:.4}));weight.castShadow=true;scene.add(weight);

// ---------- DOM chips / captions ----------
const ov=document.getElementById('ov'),capEl=document.getElementById('cap'),subEl=document.getElementById('sub'),endEl=document.getElementById('end'),fadeEl=document.getElementById('fade'),capbox=document.getElementById('capbox');
const tagwrap=document.getElementById('tagwrap');
const chipEls={};
const CHECK='<svg width="28" height="28" viewBox="0 0 28 28"><path d="M4 15l7 7L24 6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function chip(id,html,anchor,t0,u,{kind='',dx=0,dy=-8,until=1e9}={}){
  let el=chipEls[id];if(!el){el=document.createElement('div');el.className='chip '+kind;el.innerHTML=html;ov.appendChild(el);chipEls[id]=el}
  const age=u-t0;if(age<0||u>until)return;
  let x,y;if(anchor.isVector3){const v=anchor.clone().project(cam);x=(v.x*.5+.5)*W+dx;y=(-v.y*.5+.5)*H+dy}else{x=anchor[0]+dx;y=anchor[1]+dy}
  el.style.display='block';const w=el.offsetWidth;x=clamp(x,w/2+24,W-w/2-24);
  el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${Math.max(eob(age/.38),0.001)})`;}

// ---------- camera helpers ----------
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function camOrbit(tg,az,el,dist){cam.position.set(tg.x+dist*Math.cos(el)*Math.sin(az),tg.y+dist*Math.sin(el),tg.z+dist*Math.cos(el)*Math.cos(az));cam.up.set(0,1,0);cam.lookAt(tg)}
function showSteps(n=NT,op=1){for(let i=0;i<NT;i++){tiers[i].visible=i<n;tierMats[i].opacity=op;tierMats[i].depthWrite=op>.99}}
function resetObjs(){
  for(const o of [...tiers,...terr,gMain,gSecond,gThird,baseRing,baseGlow,gRing,hbar,cog,cogHalo,cube,...posts,...halves,weight,...arrows])o.visible=false;
  for(let i=0;i<NT;i++){tiers[i].position.set(0,tierY(i),0);tiers[i].scale.set(1,1,1);tierMats[i].opacity=1;tierMats[i].depthWrite=true}
  for(const g of [gMain,gSecond,gThird]){g.material.opacity=1;g.material.depthWrite=true}
  gMain.scale.setScalar(1);gMain.rotation.set(0,0,0);
  for(const h of halves)h.rotation.set(0,0,0);
  cube.scale.set(1,1,1);
  for(const e of Object.values(chipEls))e.style.display='none';
}
function pulse(t,a=.03){return 1+a*Math.sin(t*5)}

// ---------- scenes ----------
const S=[];
// 0: Giza trio, low dolly
S[0]=(u,d,t)=>{gMain.visible=gSecond.visible=gThird.visible=true;
  const k=eio(u/d);camOrbit(V(0,1.1,-1.5),lerp(-.55,-.25,k),lerp(.12,.2,k),lerp(18.5,16.2,k));
  chip('age','4.000+ TAHUN',V(0,GH+.05,0),1.2,u,{kind:'paper',dy:-14});};
// 1: why this shape?
S[1]=(u,d,t)=>{gMain.visible=gSecond.visible=gThird.visible=true;gRing.visible=true;gRing.material.opacity=eo(seg(u,.2,.7));
  const k=eio(u/d);camOrbit(V(0,.9,0),lerp(-.2,.15,k),lerp(.3,.42,k),lerp(16,15,k));
  chip('why','KENAPA PIRAMIDA?',V(0,GH+.05,0),.45,u,{kind:'paper',dy:-14});};
// 2: mastaba
S[2]=(u,d,t)=>{showSteps(1);const s=eob(seg(u,.1,.6));tiers[0].scale.set(Math.max(s,.001),Math.max(s,.001),Math.max(s,.001));tiers[0].position.y=TH/2*s;
  const k=eio(u/d);camOrbit(V(0,.3,0),lerp(.9,.55,k),lerp(.5,.4,k),lerp(13.6,12.8,k));
  chip('mastaba','MASTABA',V(0,TH,0),1.6,u,{kind:'paper',dy:-26});
  chip('flat','RENDAH & DATAR',[W/2,800],2.6,u,{dy:0});};
// 3: Imhotep stacks them
S[3]=(u,d,t)=>{showSteps(NT);
  for(let i=1;i<NT;i++){const t0=.25+(i-1)*.5;const p=seg(u,t0,t0+.34);tiers[i].visible=u>=t0;tiers[i].position.y=tierY(i)+2.6*(1-p*p);}
  const k=eio(u/d);camOrbit(V(0,.85,0),lerp(.55,.25,k),lerp(.5,.42,k),lerp(12.2,13.4,k));
  chip('imh','IMHOTEP · ±2670 SM',[W/2,800],.35,u,{kind:'paper',dy:0});};
// 4: Djoser step pyramid ~60 m
S[4]=(u,d,t)=>{showSteps(NT);
  const k=eio(u/d);camOrbit(V(0,.9,0),lerp(.25,-.35,k),lerp(.42,.3,k),lerp(13.4,13.8,k));
  const hb=eo(seg(u,1.2,2.4));setHBar(B/2+.55,B/2+.55,STEP_H*hb,Math.PI/4);
  chip('djoser','DJOSER',V(0,STEP_H,0),.5,u,{kind:'paper',dy:-16});
  chip('60m','±60 M',V(B/2+.55,STEP_H,B/2+.55),2.4,u,{dy:-14});};
// 5: compression vs bending
S[5]=(u,d,t)=>{const k=eio(u/d);camOrbit(V(0,.85,0),lerp(.3,.1,k),.32,8.6);
  if(u<1.75){cube.visible=true;const sq=eo(seg(u,.35,.75));cube.scale.set(1+.03*sq,1-.05*sq,1+.03*sq);cube.position.y=.6*(1-.05*sq);
    const top=cube.position.y*2;setArrow(arrows[0],V(0,top+.05,0),V(0,-1,0),lerp(.75,.5,sq),eo(seg(u,.15,.4)));
    setArrow(arrows[1],V(-.35,top+.05,0),V(0,-1,0),lerp(.75,.5,sq),eo(seg(u,.2,.45)));setArrow(arrows[2],V(.35,top+.05,0),V(0,-1,0),lerp(.75,.5,sq),eo(seg(u,.25,.5)));
    chip('kuat',CHECK+'DITEKAN: KUAT',V(0,1.25,0),.7,u,{dy:-40});}
  else{for(const p of posts)p.visible=true;for(const h of halves)h.visible=true;weight.visible=true;
    const a=eio(seg(u,1.9,2.55))*.06+eo(seg(u,2.55,2.85))*.32;halves[0].rotation.z=-a;halves[1].rotation.z=a;
    const drop=Math.sin(a)*1.7;weight.position.set(0,1.1+.26+.275-drop+(1-eo(seg(u,1.75,2.0)))*1.2,0);
    chip('lemah','DIBENGKOKKAN: RETAK',V(0,1.3,0),2.6,u,{kind:'paper',dy:-120});}};
// 6: each layer rests on a wider one
S[6]=(u,d,t)=>{showSteps(NT);
  const k=eio(u/d);camOrbit(V(0,.8,0),lerp(-.4,.4,k),lerp(.62,.72,k),lerp(12.6,12.0,k));
  for(let i=NT-1;i>=0;i--){const t0=.4+(NT-1-i)*.38;terr[i].visible=u>=t0;terr[i].material.opacity=eo(seg(u,t0,t0+.3))*(i==NT-1?1:.9);}
  chip('lebar','LAPISAN BAWAH LEBIH LEBAR',[W/2,800],2.6,u,{kind:'paper',dy:0});};
// 7: x-ray: mass low, load into ground
S[7]=(u,d,t)=>{showSteps(NT,lerp(1,.3,eo(seg(u,.1,.7))));
  const k=eio(u/d);camOrbit(V(0,.8,0),lerp(.35,.6,k),lerp(.36,.3,k),lerp(13.8,13.2,k));
  cog.visible=cogHalo.visible=u>.6;const cs=eob(seg(u,.6,1.0));cog.position.set(0,centroidY,0);cog.scale.setScalar(Math.max(cs,.001));cogHalo.position.copy(cog.position);cogHalo.scale.setScalar(Math.max(cs,.001)*pulse(t,.08));
  const xs=[-1.15,-.58,0,.58,1.15];
  for(let j=0;j<xs.length;j++){const ph=((u-1.3)*.9+j*.37)%1;const on=u>1.3?1:0;const x0=xs[j]*.35,x1=xs[j];
    const y=lerp(STEP_H*.8-Math.abs(xs[j])*.6,.35,ph);const x=lerp(x0,x1,ph);const dir=V(x1-x0,-(STEP_H*.8-Math.abs(xs[j])*.6-.35),0).normalize();
    setArrow(arrows[j],V(x,y,.0),dir,.45,on*Math.sin(Math.PI*ph)*.95);}
  baseRing.visible=baseGlow.visible=u>1.6;baseRing.material.opacity=eo(seg(u,1.6,2.1));baseGlow.material.opacity=.22*eo(seg(u,1.6,2.1));const gs=pulse(t,.02);baseGlow.scale.set(gs,1,gs);
  chip('massa','MASSA DI BAWAH',V(0,centroidY,0),.9,u,{dy:-30,dx:0});};
// 8: smoothed -> Great Pyramid, tallest ~3,800 yrs
S[8]=(u,d,t)=>{const f=eo(seg(u,.2,1.4));showSteps(f>.985?0:NT);gMain.visible=true;gMain.material.opacity=f;gMain.material.depthWrite=f>.985;gMain.scale.setScalar(lerp(1.05,1,f));
  const k=eio(u/d);camOrbit(V(0,1.0,0),lerp(.55,-.15,k),lerp(.34,.22,k),lerp(13.4,14.6,k));
  const hb=eo(seg(u,1.6,2.6));setHBar(GB/2+.55,GB/2+.55,GH*hb,Math.PI/4);
  chip('146','146 M',V(GB/2+.55,GH,GB/2+.55),2.6,u,{dy:-14});
  chip('tall','TERTINGGI ±3.800 TAHUN',[W/2,800],3.4,u,{kind:'paper',dy:0});};
// 9: end card
S[9]=(u,d,t)=>{gMain.visible=gSecond.visible=gThird.visible=true;
  camOrbit(V(0,1.0,-1.5),-.3+u*.12,.2,17);};

// ---------- frame ----------
function sceneAt(t){for(let i=TL.scenes.length-1;i>=0;i--)if(t>=TL.scenes[i].t0-1e-6)return i;return 0}
window.setT=(t)=>{
  const i=sceneAt(t),sc=TL.scenes[i],u=t-sc.t0,d=sc.t1-sc.t0;
  resetObjs();
  S[i](u,d,t);
  cam.updateMatrixWorld(true);
  S[i](u,d,t); // second pass so chips project with the final camera
  if(i<9){capbox.style.display='block';endEl.style.display='none';
    const words=sc.id.split(' ');const tot=sc.id.length;let acc=0;const p=clamp((t-sc.start)/sc.dur);
    capEl.innerHTML=words.map(w=>{const on=t>=sc.start&&acc/tot<=p+.001;acc+=w.length+1;return `<span class="${on?'':'off'}">${w}</span>`}).join(' ');
    subEl.textContent=sc.en;}
  else{capbox.style.display='none';endEl.style.display='block';const a=eo(seg(u,.15,.75));tagwrap.style.opacity=a;tagwrap.style.transform=`translateY(${(1-a)*24}px)`;}
  const fin=1-clamp(t/.35),fout=clamp((t-(TL.total-.6))/.6);fadeEl.style.opacity=Math.max(fin,fout);
  renderer.render(scene,cam);
};
window.__r=renderer;
window.READY=true;
