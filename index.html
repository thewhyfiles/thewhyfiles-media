<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=720,H=1280;
const BLUE=0x536dff,PAPER=0xf2f0e9,INK=0x171717,LGREY=0xd9d9d5;
const TL=await (await fetch('timeline.json')).json();
await Promise.all([document.fonts.load('700 46px Sora'),document.fonts.load('800 29px Sora'),document.fonts.load('400 23px Inter'),document.fonts.load('500 22px Inter'),document.fonts.load('400 84px "DM Serif Display"')]);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(u,a,b)=>clamp((u-a)/(b-a));

// ---------- renderer ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(INK);scene.fog=new THREE.Fog(INK,12,30);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.5;
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,80);
cam.setViewOffset(W,H,0,150,W,H);

const sun=new THREE.DirectionalLight(0xfff1e0,2.6);sun.position.set(4,8,3.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.02;scene.add(sun);scene.add(sun.target);
const hemi=new THREE.HemisphereLight(0xc4ccff,0x1c1c1b,0.35);scene.add(hemi);

function rngMaker(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
const blueBasic=(op=1)=>new THREE.MeshBasicMaterial({color:BLUE,transparent:true,opacity:op,toneMapped:false,depthWrite:false});
const paperBasic=(op=1)=>new THREE.MeshBasicMaterial({color:PAPER,transparent:true,opacity:op,toneMapped:false,depthWrite:false});
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

// ---------- ground ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x1f1f1e,roughness:1}));
ground.receiveShadow=true;scene.add(ground);

// ---------- sundial ----------
const DR=1.25,DH=.2,ROD=.75;
function makeSundial(){
  const g=new THREE.Group();
  const top=new THREE.MeshStandardMaterial({color:0x4f4b45,roughness:.85,metalness:.05});
  const side=new THREE.MeshStandardMaterial({color:0x3e3b36,roughness:.8,metalness:.1});
  const disk=new THREE.Mesh(new THREE.CylinderGeometry(DR,DR*1.04,DH,96),[side,top,side]);disk.position.y=DH/2;disk.castShadow=disk.receiveShadow=true;g.add(disk);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(DR*.93,.012,8,128).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0x8d887d,roughness:.5,metalness:.6}));rim.position.y=DH+.004;g.add(rim);
  const tickMat=new THREE.MeshStandardMaterial({color:0xd9d6cc,roughness:.6});
  for(let k=0;k<=12;k++){const a=Math.PI-k*Math.PI/12;const L=k%3==0?.26:.15;
    const m=new THREE.Mesh(new THREE.BoxGeometry(L,.012,k%3==0?.045:.03),tickMat);
    const r=DR*.8;m.position.set(Math.cos(a)*r,DH+.006,-Math.sin(a)*r);m.rotation.y=a;m.receiveShadow=true;g.add(m);}
  const metal=new THREE.MeshStandardMaterial({color:0xb9b4a8,roughness:.35,metalness:.85});
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,ROD,24),metal);rod.position.y=DH+ROD/2;rod.castShadow=true;g.add(rod);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(.075,24,16),metal);tip.position.y=DH+ROD;tip.castShadow=true;g.add(tip);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.03,24),metal);base.position.y=DH+.015;g.add(base);
  scene.add(g);return g;}
const dial=makeSundial();
const dial2=makeSundial();

// ---------- clock ----------
const CR=1.1;
function makeClock(){
  const g=new THREE.Group();
  const face=new THREE.Mesh(new THREE.CylinderGeometry(CR,CR,.12,96),[new THREE.MeshStandardMaterial({color:0x6b6860,metalness:.8,roughness:.4}),new THREE.MeshStandardMaterial({color:0x262624,roughness:.7}),new THREE.MeshStandardMaterial({color:0x6b6860,metalness:.8,roughness:.4})]);
  face.position.y=.06;face.castShadow=face.receiveShadow=true;g.add(face);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(CR,.06,16,128).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0x9a968c,metalness:.85,roughness:.32}));rim.position.y=.12;rim.castShadow=true;g.add(rim);
  const tm=new THREE.MeshStandardMaterial({color:0xe8e5dc,roughness:.5});
  for(let k=0;k<12;k++){const a=k*Math.PI/6;const L=k%3==0?.2:.11;const m=new THREE.Mesh(new THREE.BoxGeometry(k%3==0?.06:.035,.015,L),tm);
    const r=CR*.84;m.position.set(Math.sin(a)*r,.125,-Math.cos(a)*r);m.rotation.y=-a;g.add(m);}
  const handM=new THREE.MeshStandardMaterial({color:0xf2f0e9,roughness:.45});
  const mk=(w,L,y)=>{const geo=new THREE.BoxGeometry(w,.025,L);geo.translate(0,0,-L/2+.08);const h=new THREE.Mesh(geo,handM);h.position.y=y;h.castShadow=true;const p=new THREE.Group();p.add(h);g.add(p);return p};
  const hour=mk(.085,.55,.15),minute=mk(.055,.85,.18);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.05,24),new THREE.MeshBasicMaterial({color:BLUE,toneMapped:false}));cap.position.y=.2;g.add(cap);
  scene.add(g);return {g,hour,minute};}
const clock=makeClock();
const clock2=makeClock();
function setHands(c,a){c.minute.rotation.y=-a;c.hour.rotation.y=-a/12-1.2;}

// ---------- tower ----------
const tower=new THREE.Group();{
  const stone=new THREE.MeshStandardMaterial({color:0x4a4741,roughness:.9});
  const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,6,2.2),stone);b.position.y=3;b.castShadow=b.receiveShadow=true;tower.add(b);
  const band=new THREE.Mesh(new THREE.BoxGeometry(2.4,.18,2.4),new THREE.MeshStandardMaterial({color:0x5c5850,roughness:.8}));band.position.y=6.0;band.castShadow=true;tower.add(band);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.85,2.2,4),new THREE.MeshStandardMaterial({color:0x34322e,roughness:.7,metalness:.2}));roof.rotation.y=Math.PI/4;roof.position.y=7.2;roof.castShadow=true;tower.add(roof);
  const win=new THREE.MeshStandardMaterial({color:0x101010,roughness:1});
  for(const y of [1.4,2.8]){const w=new THREE.Mesh(new THREE.BoxGeometry(.4,.8,.05),win);w.position.set(0,y,1.11);tower.add(w);}
  scene.add(tower);}
const tclock=makeClock();scene.remove(tclock.g);tower.add(tclock.g);tclock.g.rotation.x=Math.PI/2;tclock.g.position.set(0,4.75,1.1);tclock.g.scale.setScalar(.82);

// ---------- sun ----------
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(.24,32,20),new THREE.MeshBasicMaterial({color:0xfff6e2,toneMapped:false}));scene.add(sunBall);
const sunGlow=new THREE.Mesh(new THREE.SphereGeometry(.42,32,20),paperBasic(.16));sunBall.add(sunGlow);
const pathDots=[];{const g=new THREE.SphereGeometry(.035,10,8);for(let k=0;k<36;k++){const m=new THREE.Mesh(g,blueBasic(.85));scene.add(m);pathDots.push(m);}}
// sun direction: p 0=east(+x) .5=south(+z / north if south=false) 1=west(-x)
function sunDir(p,south=true){const th=Math.PI*p;const el=lerp(.25,1.0,Math.sin(th));const hz=Math.cos(el);
  return V(Math.cos(th)*hz,Math.sin(el),(south?1:-1)*Math.sin(th)*hz).normalize();}
function setSun(p,south=true,showBall=false,R=4.2){const d=sunDir(p,south);sun.position.copy(d).multiplyScalar(14);sun.target.position.set(0,0,0);
  sunBall.visible=showBall;sunBall.position.copy(d).multiplyScalar(R);return d}
function arcPoint(p,R=4.2,south=true){return sunDir(p,south).multiplyScalar(R)}
function showPath(upto,R=4.2,south=true,op=.85){pathDots.forEach((m,k)=>{const p=.02+k/(pathDots.length-1)*.96;m.visible=p<=upto;m.position.copy(arcPoint(p,R,south));m.material.opacity=op})}
// shadow screen angle (top view, up = north): returns angle in ring coords
function shadowAng(p,south=true){const d=sunDir(p,south);return Math.atan2(south?d.z:d.z,-d.x)}
// ring coords: θ maps to ground (cosθ,0,-sinθ)
// ---------- arcs ----------
function mkArc(){const m=new THREE.Mesh(new THREE.BufferGeometry(),blueBasic());m.renderOrder=5;scene.add(m);
  const head=new THREE.Mesh(new THREE.CircleGeometry(.16,3).rotateX(-Math.PI/2),blueBasic());head.renderOrder=6;scene.add(head);return {m,head}}
function setArc(a,r,w,th0,th1,y,cw=true,op=1){ // draw from th0 to th1 (radians, ring coords)
  const s=Math.min(th0,th1),L=Math.abs(th1-th0);a.m.geometry.dispose();
  a.m.geometry=new THREE.RingGeometry(r-w/2,r+w/2,72,1,s,Math.max(L,1e-3)).rotateX(-Math.PI/2);a.m.position.set(0,y,0);a.m.visible=L>.02;a.m.material.opacity=op;
  const te=th1;const tx=Math.cos(te)*r,tz=-Math.sin(te)*r;
  // tangent direction of motion on ground
  const dirSign=th1<th0?-1:1;const tg=V(-Math.sin(te)*dirSign,0,-Math.cos(te)*dirSign);
  a.head.position.set(tx,y+.002,tz);a.head.rotation.set(0,Math.atan2(-tg.z,tg.x),0);a.head.visible=L>.05;a.head.material.opacity=op;
  // circle(3) default points +x in XY -> after rotateX ground +x; rotation.y orients
}
const arcA=mkArc(),arcB=mkArc();

// ---------- DOM chips / captions ----------
const ov=document.getElementById('ov'),capEl=document.getElementById('cap'),subEl=document.getElementById('sub'),endEl=document.getElementById('end'),fadeEl=document.getElementById('fade'),capbox=document.getElementById('capbox');
const tagwrap=document.getElementById('tagwrap');
const chipEls={};
const CHECK='<svg width="28" height="28" viewBox="0 0 28 28"><path d="M4 15l7 7L24 6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function chip(id,html,anchor,t0,u,{kind='',dx=0,dy=-8,until=1e9}={}){
  let el=chipEls[id];if(!el){el=document.createElement('div');el.className='chip '+kind;el.innerHTML=html;ov.appendChild(el);chipEls[id]=el}
  const age=u-t0;if(age<0||u>until)return;
  let x,y;if(anchor.isVector3){const v=anchor.clone().project(cam);x=(v.x*.5+.5)*W+dx;y=(-v.y*.5+.5)*H+dy}else{x=anchor[0]+dx;y=anchor[1]+dy}
  el.style.display='block';const w=el.offsetWidth;x=clamp(x,w/2+24,W-w/2-24);
  el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${Math.max(eob(age/.38),0.001)})`;}

// ---------- camera helpers ----------
function camOrbit(tg,az,el,dist){cam.position.set(tg.x+dist*Math.cos(el)*Math.sin(az),tg.y+dist*Math.sin(el),tg.z+dist*Math.cos(el)*Math.cos(az));cam.up.set(0,1,0);cam.lookAt(tg)}
function camTop(tg,h,roll=0){cam.position.set(tg.x,tg.y+h,tg.z+1e-4);cam.up.set(Math.sin(roll),0,-Math.cos(roll));cam.lookAt(tg)}
function resetObjs(){
  for(const o of [dial,dial2,clock.g,clock2.g,tower,sunBall,arcA.m,arcA.head,arcB.m,arcB.head,...pathDots])o.visible=false;
  for(const o of [dial,dial2,clock.g,clock2.g,tower]){o.position.set(0,0,0);o.rotation.set(0,0,0);o.scale.set(1,1,1)}
  setSun(.3);sun.intensity=2.6;scene.fog.near=12;scene.fog.far=30;
  for(const e of Object.values(chipEls))e.style.display='none';
}
const TOPY=DH+.01;
// top-view sundial shadow sweep with trail arc
function sweep(p0,p,south,arc,r=DR*.62){const a0=shadowAng(p0,south),a1=shadowAng(p,south);setArc(arc,r,.06,a0,a1,TOPY+.005);}

// ---------- scenes ----------
const S=[];
// 0: clock, hands spinning, why this way?
S[0]=(u,d,t)=>{const c=clock;c.g.visible=true;c.g.position.y=.0;
  setSun(.35);const k=eio(u/d);camOrbit(V(0,.1,0),lerp(-.35,.2,k),lerp(1.25,1.05,k),lerp(9.6,8.8,k));
  const a=.4+u*1.9;setHands(c,a);
  setArc(arcA,CR*1.32,.07,Math.PI/2+.3,Math.PI/2+.3-Math.min(2.4,eo(seg(u,.5,1.6))*2.4),.02);
  chip('arah','KENAPA ARAH INI?',[W/2,700],1.3,u,{kind:'paper',dy:0});};
// 1: long before gears: sundial appears, sun rises
S[1]=(u,d,t)=>{dial.visible=true;const s=eob(seg(u,0,.6));dial.scale.set(s,s,s);
  const p=lerp(.08,.3,eio(u/d));setSun(p,true,true,2.5);showPath(p,2.5,true,.6);
  const k=eio(u/d);camOrbit(V(0,1.05,.6),lerp(3.6,3.25,k),lerp(.42,.36,k),lerp(9.0,8.2,k));
  chip('bay','BAYANGAN',V(-1.0,DH,-.3),1.4,u,{kind:'paper',dy:-12});};
// 2: pointer + dial
S[2]=(u,d,t)=>{dial.visible=true;const p=lerp(.3,.36,u/d);setSun(p,true,false);
  const k=eio(u/d);camOrbit(V(0,.4,0),lerp(2.7,2.35,k),lerp(.5,.62,k),lerp(6.8,7.4,k));
  chip('pen','PENUNJUK',V(0,DH+ROD+.1,0),.5,u,{dy:-10});
  chip('pir','PIRINGAN',V(DR*.7,DH,DR*.4),1.3,u,{kind:'paper',dy:-6});};
// 3: sun path east -> south sky
S[3]=(u,d,t)=>{dial.visible=true;const p=lerp(.03,.5,eio(seg(u,.2,d-.4)));setSun(p,true,true,3.0);showPath(Math.max(p,.04),3.0,true,.8);
  const k=eio(u/d);camOrbit(V(0,1.3,.6),lerp(3.05,3.2,k),lerp(.24,.28,k),lerp(16.5,15.6,k));
  chip('tim','TIMUR',arcPoint(.04,3.0).setY(.2),.5,u,{kind:'paper',dy:-10});
  chip('sel','LANGIT SELATAN',arcPoint(.5,3.0),2.4,u,{dy:-30});};
// 4: top view shadow sweep W -> N -> E
S[4]=(u,d,t)=>{dial.visible=true;const p=lerp(.06,.94,eio(seg(u,.2,d-.2)));setSun(p,true,false);
  camTop(V(0,0,-.2),lerp(10.4,9.8,eio(u/d)));
  sweep(.06,p,true,arcA);
  const r=DR*1.08;
  chip('bar','BARAT',V(-r,TOPY,0),.3,u,{kind:'paper',dy:-4,dx:-14});
  chip('uta','UTARA',V(0,TOPY,-r),1.5,u,{kind:'paper',dy:-4});
  chip('tim2','TIMUR',V(r,TOPY,0),2.7,u,{kind:'paper',dy:-4,dx:14});};
// 5: clockwise! dial -> clock crossfade
S[5]=(u,d,t)=>{const k=eio(seg(u,.9,1.7));setSun(.94);
  camTop(V(0,0,-.1),lerp(9.8,9.2,eio(u/d)));
  if(k<1){dial.visible=true;const s=1-k;dial.scale.set(s,s,s);}
  if(k>0){clock.g.visible=true;const s=eob(k);clock.g.scale.set(s,s,s);setHands(clock,-Math.PI/2+(u-.9)*1.4);}
  setArc(arcA,DR*1.18,.08,shadowAng(.06),shadowAng(.06)-Math.PI*lerp(1,1.3,eo(seg(u,.9,d))),.03);
  chip('cw','SEARAH JARUM JAM',[W/2,810],.35,u,{dy:0});};
// 6: medieval Europe clock tower
S[6]=(u,d,t)=>{tower.visible=true;setSun(.62);sun.intensity=2.8;scene.fog.near=16;scene.fog.far=40;
  setHands(tclock,2+u*.9);
  const k=eio(u/d);camOrbit(V(0,lerp(3.6,4.4,k),0),lerp(-.5,-.25,k),lerp(.04,.1,k),lerp(19.5,18.0,k));
  chip('eropa','EROPA · ABAD PERTENGAHAN',[W/2,262],.6,u,{kind:'paper',dy:0});};
// 7: sundial and clock side by side, same motion
S[7]=(u,d,t)=>{dial.visible=true;clock.g.visible=true;dial.position.x=-1.45;clock.g.position.x=1.45;
  const p=lerp(.1,.9,eio(seg(u,.1,d-.1)));setSun(p);
  const k=eio(u/d);camTop(V(0,0,-.1),lerp(15.0,14.2,k));
  // sundial trail (in dial local coords offset)
  const a0=shadowAng(.1),a1=shadowAng(p);setArc(arcA,DR*.62,.06,a0,a1,TOPY+.005);arcA.m.position.x=-1.45;arcA.head.position.x-=1.45;
  setHands(clock,Math.PI/2-a1);
  chip('sama2','GERAK YANG SAMA',[W/2,330],1.0,u,{kind:'paper',dy:0});};
// 8: southern hemisphere: counterclockwise
S[8]=(u,d,t)=>{dial.visible=true;const p=lerp(.06,.94,eio(seg(u,.3,d-.2)));setSun(p,false,false);
  camTop(V(0,0,.1),lerp(10.4,9.8,eio(u/d)));
  sweep(.06,p,false,arcA);
  chip('sel2','BELAHAN SELATAN',[W/2,262],.3,u,{kind:'paper',dy:0});
  chip('rev','BERLAWANAN ARAH',[W/2,770],1.6,u,{dy:0});};
// 9: standard: tower clock again, closer
S[9]=(u,d,t)=>{tower.visible=true;setSun(.62);sun.intensity=2.8;scene.fog.near=16;scene.fog.far=40;
  setHands(tclock,5+u*.9);
  const k=eio(u/d);camOrbit(V(0,4.7,0),lerp(.3,.1,k),lerp(.1,.05,k),lerp(11.5,10.5,k));
  chip('std',CHECK+'STANDAR',[W/2,290],.9,u,{dy:0});};
// 10: end card
S[10]=(u,d,t)=>{dial.visible=true;clock.g.visible=true;dial.position.x=-1.45;clock.g.position.x=1.45;setSun(.4+u*.08);setHands(clock,u*1.2);
  camOrbit(V(0,.3,0),u*.25,.75,9.5);};

// ---------- frame ----------
function sceneAt(t){for(let i=TL.scenes.length-1;i>=0;i--)if(t>=TL.scenes[i].t0-1e-6)return i;return 0}
window.setT=(t)=>{
  const i=sceneAt(t),sc=TL.scenes[i],u=t-sc.t0,d=sc.t1-sc.t0;
  resetObjs();
  S[i](u,d,t);
  cam.updateMatrixWorld(true);
  S[i](u,d,t);
  if(i<10){capbox.style.display='block';endEl.style.display='none';
    const words=sc.id.split(' ');const tot=sc.id.length;let acc=0;const p=clamp((t-sc.start)/sc.dur);
    capEl.innerHTML=words.map(w=>{const on=t>=sc.start&&acc/tot<=p+.001;acc+=w.length+1;return `<span class="${on?'':'off'}">${w}</span>`}).join(' ');
    subEl.textContent=sc.en;}
  else{capbox.style.display='none';endEl.style.display='block';const a=eo(seg(u,.15,.75));tagwrap.style.opacity=a;tagwrap.style.transform=`translateY(${(1-a)*24}px)`;}
  const fin=1-clamp(t/.35),fout=clamp((t-(TL.total-.6))/.6);fadeEl.style.opacity=Math.max(fin,fout);
  renderer.render(scene,cam);
};
window.__r=renderer;
window.READY=true;
</script>
