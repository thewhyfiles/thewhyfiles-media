<canvas id="c" width="720" height="1280"></canvas>
<div id="ov">
  <div id="vig"></div>

  <div id="end"><div id="tagwrap"><div id="bar"></div><div id="tag">Setiap hal<br>punya <em>alasan.</em></div><div id="en">Everything has a reason.</div><div id="handle">@thewhyfiles.id</div></div></div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=720,H=1280;
const BLUE=0x536dff,PAPER=0xf2f0e9,INK=0x171717,LGREY=0xd9d9d5;
const TL=await (await fetch('timeline.json')).json();
await Promise.all([document.fonts.load('700 46px Sora'),document.fonts.load('800 29px Sora'),document.fonts.load('400 23px Inter'),document.fonts.load('500 22px Inter'),document.fonts.load('400 84px "DM Serif Display"')]);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(u,a,b)=>clamp((u-a)/(b-a));

// ---------- renderer ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(INK);scene.fog=new THREE.Fog(INK,24,52);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.5;
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,80);
cam.setViewOffset(W,H,0,150,W,H);

const sun=new THREE.DirectionalLight(0xfff1e0,2.2);sun.position.set(4,9,3.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:28});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.02;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xc4ccff,0x1c1c1b,0.35));

// ---------- QR model ----------
const N=21,M=0.2,HALF=N*M/2;
function rngMaker(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
const isFinder=(r,c)=>(r<8&&c<8)||(r<8&&c>=N-8)||(r>=N-8&&c<8);
const grid=[];{const rnd=rngMaker(20261104);
  for(let r=0;r<N;r++){grid[r]=[];for(let c=0;c<N;c++){let v;
    if(isFinder(r,c))v=0;else if(r==6)v=(c%2==0)?1:0;else if(c==6)v=(r%2==0)?1:0;else v=rnd()<.5?1:0;grid[r][c]=v}}
  grid[13][8]=1;}
const mx=c=>(c-10)*M, mz=r=>(r-10)*M;
const qr=new THREE.Group();scene.add(qr);
const plateMat=new THREE.MeshStandardMaterial({color:0xa9a59a,roughness:.8,metalness:0});
const fBaseMat=new THREE.MeshStandardMaterial({color:0xa9a59a,roughness:.8,metalness:0});
const inkMat=new THREE.MeshStandardMaterial({color:0x1d1d1d,roughness:.55,metalness:.1});
const PW=25*M;
const plate=new THREE.Mesh(new THREE.BoxGeometry(PW,.24,PW),[plateMat,plateMat,plateMat,plateMat,plateMat,plateMat]);plate.position.y=-.12;plate.castShadow=plate.receiveShadow=true;qr.add(plate);
const DH=.09;
const data=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c])data.push([r,c]);
// reading order: zig-zag columns pairs from bottom right
const order=data.map((d,i)=>i).sort((a,b)=>{const A=data[a],B=data[b];const pa=Math.floor((N-1-A[1])/2),pb=Math.floor((N-1-B[1])/2);if(pa!=pb)return pa-pb;const up=pa%2==0;return up?(B[0]-A[0]):(A[0]-B[0])});
const rank=new Array(data.length);order.forEach((idx,k)=>rank[idx]=k);
const inst=new THREE.InstancedMesh(new THREE.BoxGeometry(M*.985,DH,M*.985),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55,metalness:.1}),data.length);
inst.castShadow=inst.receiveShadow=true;qr.add(inst);
const dummy=new THREE.Object3D(),cInk=new THREE.Color(0x1d1d1d),cBlue=new THREE.Color(BLUE),tmpC=new THREE.Color();
let instDirty=true;
function setInst(scaleFn,colorFn){for(let i=0;i<data.length;i++){const [r,c]=data[i];const s=scaleFn?scaleFn(i):1;dummy.position.set(mx(c),DH/2*s,mz(r));dummy.scale.set(Math.max(s,.001),Math.max(s,.001),Math.max(s,.001));dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix);
  inst.setColorAt(i,colorFn?colorFn(i):cInk)}inst.instanceMatrix.needsUpdate=true;inst.instanceColor.needsUpdate=true;}
setInst();
const blueBasic=(op=1)=>new THREE.MeshBasicMaterial({color:BLUE,transparent:true,opacity:op,toneMapped:false,depthWrite:false});
function frameGeo(ho,hi){const s=new THREE.Shape();s.moveTo(-ho,-ho);s.lineTo(ho,-ho);s.lineTo(ho,ho);s.lineTo(-ho,ho);s.closePath();const p=new THREE.Path();p.moveTo(-hi,-hi);p.lineTo(-hi,hi);p.lineTo(hi,hi);p.lineTo(hi,-hi);p.closePath();s.holes.push(p);return new THREE.ShapeGeometry(s).rotateX(-Math.PI/2)}
const FC=[[-1.4,-1.4],[1.4,-1.4],[-1.4,1.4]];
const finders=FC.map(([x,z])=>{const g=new THREE.Group();g.position.set(x,0,z);
  const base=new THREE.Mesh(new THREE.BoxGeometry(7*M,.06,7*M),fBaseMat);base.position.y=-.027;base.castShadow=base.receiveShadow=true;g.add(base);
  const a=3.5*M,b=2.5*M;const sides=[[0,-(a+b)/2,7*M,M],[0,(a+b)/2,7*M,M],[-(a+b)/2,0,M,5*M],[(a+b)/2,0,M,5*M]];
  for(const [sx,sz,w,d] of sides){const m=new THREE.Mesh(new THREE.BoxGeometry(w*.995,DH,d*.995),inkMat);m.position.set(sx,DH/2,sz);m.castShadow=m.receiveShadow=true;g.add(m)}
  const core=new THREE.Mesh(new THREE.BoxGeometry(3*M*.995,DH,3*M*.995),inkMat);core.position.y=DH/2;core.castShadow=core.receiveShadow=true;g.add(core);
  const ring=new THREE.Mesh(frameGeo(3.5*M*1.2,3.5*M*1.09),blueBasic());ring.position.y=.005;ring.renderOrder=5;g.add(ring);
  const glow=new THREE.Mesh(frameGeo(3.5*M*1.42,3.5*M*1.2),blueBasic(.2));glow.position.y=.004;glow.renderOrder=4;g.add(glow);
  qr.add(g);return{g,ring,glow,x,z};});
// empty corner dashed outline
const emptyMark=new THREE.Group();{const h=3.5*M*1.1,n=6,mat=blueBasic();for(let s=0;s<4;s++)for(let k=0;k<n;k++){const L=2*h/n*.55;const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),mat);const t=-h+2*h/n*(k+.5);
  if(s<2){m.position.set(t,0,s==0?-h:h);m.scale.set(L,1,.06)}else{m.position.set(s==2?-h:h,0,t);m.scale.set(.06,1,L)}m.renderOrder=6;emptyMark.add(m)}
  emptyMark.position.set(1.4,.13,1.4);qr.add(emptyMark);}
// lines & dots (qr-local)
const lineGeo=new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2);
const dotGeo=new THREE.CircleGeometry(1,32).rotateX(-Math.PI/2);
function mkLine(mat){const m=new THREE.Mesh(lineGeo,mat);m.renderOrder=7;qr.add(m);return m}
function mkDot(mat){const m=new THREE.Mesh(dotGeo,mat);m.renderOrder=8;qr.add(m);return m}
function setLine(m,x0,z0,x1,z1,w,y=.105){const dx=x1-x0,dz=z1-z0,L=Math.hypot(dx,dz);m.position.set((x0+x1)/2,y,(z0+z1)/2);m.rotation.set(0,-Math.atan2(dz,dx),0);m.scale.set(Math.max(L,1e-4),1,w);m.visible=L>1e-3}
function setDot(m,x,z,r,y=.11){m.position.set(x,y,z);m.scale.set(r,1,r);m.visible=true}
const cutLine=mkLine(blueBasic());const ticks=[];for(let k=0;k<6;k++){const o=mkDot(new THREE.MeshBasicMaterial({color:PAPER,toneMapped:false,depthWrite:false,transparent:true}));o.renderOrder=9;const i=mkDot(blueBasic());i.renderOrder=10;ticks.push({o,i})}
const beam=mkLine(blueBasic(1)),beamGlow=mkLine(blueBasic(.16));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x1b1b1a,roughness:1}));ground.position.y=-1.1;ground.receiveShadow=true;scene.add(ground);

// ---------- DOM chips / captions ----------
const ov=document.getElementById('ov'),capEl=document.getElementById('cap'),subEl=document.getElementById('sub'),endEl=document.getElementById('end'),fadeEl=document.getElementById('fade'),capbox=document.getElementById('capbox');
const tagwrap=document.getElementById('tagwrap');
const chipEls={};
const UP='<svg width="24" height="28" viewBox="0 0 24 28"><path d="M12 25V4M3 12l9-9 9 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function chip(id,html,anchor,t0,u,{kind='',dx=0,dy=-8,until=1e9}={}){
  let el=chipEls[id];if(!el){el=document.createElement('div');el.className='chip '+kind;el.innerHTML=html;ov.appendChild(el);chipEls[id]=el}
  const age=u-t0;if(age<0||u>until)return;
  let x,y;if(anchor.isVector3){const v=anchor.clone().project(cam);x=(v.x*.5+.5)*W+dx;y=(-v.y*.5+.5)*H+dy}else{x=anchor[0]+dx;y=anchor[1]+dy}
  el.style.display='block';const w=el.offsetWidth;x=clamp(x,w/2+24,W-w/2-24);
  el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${Math.max(eob(age/.38),0.001)})`;}

// ---------- camera helpers ----------
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const Lw=(x,y,z)=>{qr.updateMatrixWorld(true);return qr.localToWorld(V(x,y,z))};
function camOrbit(tg,az,el,dist){cam.position.set(tg.x+dist*Math.cos(el)*Math.sin(az),tg.y+dist*Math.sin(el),tg.z+dist*Math.cos(el)*Math.cos(az));cam.up.set(0,1,0);cam.lookAt(tg)}
function camTop(tg,h,roll=0){cam.position.set(tg.x,tg.y+h,tg.z+1e-4);cam.up.set(Math.sin(roll),0,-Math.cos(roll));cam.lookAt(tg)}
function resetObjs(){
  qr.position.set(0,0,0);qr.rotation.set(0,0,0,'XYZ');plateMat.color.setHex(0xa9a59a);
  for(const f of finders){f.g.position.set(f.x,0,f.z);f.ring.visible=f.glow.visible=false;f.ring.material.opacity=1;f.glow.material.opacity=.2;f.g.rotation.set(0,0,0);f.g.scale.set(1,1,1)}
  for(const o of [emptyMark,cutLine,beam,beamGlow])o.visible=false;for(const t of ticks){t.o.visible=t.i.visible=false}
  if(instDirty){setInst();instDirty=false}
  for(const e of Object.values(chipEls))e.style.display='none';
}
function ringsOn(f,op,t=0){f.ring.visible=f.glow.visible=op>0.001;f.ring.material.opacity=op;f.glow.material.opacity=.2*op*(1+.25*Math.sin(t*5))}
function lift(f,h){f.g.position.y=h}
function sweep(p){const z=lerp(-HALF-.5,HALF+.5,p);setLine(beam,-PW/2,z,PW/2,z,.05,.15);setLine(beamGlow,-PW/2,z-.3,PW/2,z-.3,.6,.14);}
function ratioLine(fi,theta,grow){const f=finders[fi];const c=Math.cos(theta),s=Math.sin(theta),k=1/Math.max(Math.abs(c),Math.abs(s));
  const R=3.5*M*k+.18;const x0=f.x-c*R,z0=f.z-s*R;const len=2*R*grow;setLine(cutLine,x0,z0,x0+c*len,z0+s*len,.045,.105);
  const ds=[-3.5,-2.5,-1.5,1.5,2.5,3.5];ds.forEach((d,j)=>{const dd=d*M*k;const along=dd+R;const on=along<=len+1e-3;const T=ticks[j];if(!on){T.o.visible=T.i.visible=false;return}
    const x=f.x+c*dd,z=f.z+s*dd;setDot(T.o,x,z,.085,.11);setDot(T.i,x,z,.055,.112)});}

// ---------- scenes ----------
const S=[];
// 0: look at a QR code (modules build up)
S[0]=(u,d,t)=>{const k=eio(u/d);camTop(V(0,0,0),lerp(25,19,k),lerp(.5,0,k));
  setInst(i=>eob(seg(u,.1+rank[i]/data.length*1.4*0+((i*37)%data.length)/data.length*1.3,.45+((i*37)%data.length)/data.length*1.3)),null);instDirty=true;};
// 1: three big squares lift, why?
S[1]=(u,d,t)=>{const k=eio(u/d);camOrbit(V(0,0,.2),lerp(.5,-.25,k),lerp(1.15,.95,k),lerp(18.8,17.8,k));
  finders.forEach((f,j)=>{const a=eob(seg(u,.35+j*.3,.85+j*.3));lift(f,.45*a);ringsOn(f,seg(u,.35+j*.3,.7+j*.3),t)});
  chip('tiga','3 KOTAK BESAR',Lw(0,.5,-1.4-.9),1.4,u,{until:2.35,dy:-14});
  chip('kenapa','KENAPA?',[W/2,800],2.45,u,{kind:'paper',dy:0});};
// 2: finder patterns = position markers, scan beam
S[2]=(u,d,t)=>{const k=eio(u/d);camOrbit(V(0,0,.2),lerp(-.25,.2,k),lerp(.95,1.0,k),lerp(17.8,17.4,k));
  finders.forEach(f=>{lift(f,.45*(1-eio(seg(u,1.6,2.4))));ringsOn(f,1,t)});
  beam.visible=true;sweep(seg(u,.2,2.9));if(u>3.0){beam.visible=beamGlow.visible=false}
  chip('fp','FINDER PATTERN',Lw(-1.4,.5,-1.4),.5,u,{dy:-70});
  chip('pos','PENANDA POSISI',[W/2,800],1.9,u,{kind:'paper',dy:0});};
// 3: stripes ratio close-up
S[3]=(u,d,t)=>{const f=finders[0];const k=eio(u/d);camTop(V(f.x,0,f.z+.3),lerp(8.6,8.0,k),lerp(-.08,0,k));
  ringsOn(f,1-seg(u,0,.5),t);plateMat.color.setHex(0xa9a59a).lerp(new THREE.Color(0x4a4843),eio(seg(u,.2,1.2)));
  ratioLine(0,0,eo(seg(u,1.3,3.7)));
  chip('rasio','1 : 1 : 3 : 1 : 1',[W/2,800],3.75,u,{kind:'paper',dy:0});};
// 4: any angle through center
S[4]=(u,d,t)=>{const f=finders[0];const k=eio(u/d);camTop(V(f.x,0,f.z+.3),lerp(8.0,8.5,k),0);
  plateMat.color.setHex(0x4a4843);const th=lerp(0,Math.PI*0.86,eio(seg(u,.3,4.6)));ratioLine(0,th,1);
  chip('rasio2','1 : 1 : 3 : 1 : 1',[W/2,800],0,u,{kind:'paper',dy:0});
  chip('tetap','RASIO TETAP',[W/2,250],1.6,u,{dy:0});};
// 5: tilted code, scanner finds them
S[5]=(u,d,t)=>{qr.rotation.set(lerp(-.32,-.42,eio(u/d)),lerp(.5,.9,eio(u/d)),.28,'XYZ');qr.position.y=.3;
  const k=eio(u/d);camOrbit(V(0,.2,.3),lerp(-.5,-.3,k),.92,lerp(20.4,19.6,k));
  beam.visible=true;sweep(seg(u,.1,2.4));if(u>2.5){beam.visible=beamGlow.visible=false}
  const hit=[.1+(.5-(-1.4+HALF+.5)/(PW+1)*0)*0,0,0];
  finders.forEach((f,j)=>{const p=(f.z+HALF+.5)/(2*HALF+1);const tp=.1+p*2.3;ringsOn(f,eob(seg(u,tp,tp+.3))>0?Math.min(1,eob(seg(u,tp,tp+.3))):0,t);
    const s=1+.12*Math.sin(Math.PI*seg(u,tp,tp+.4));f.g.scale.set(s,1,s)});
  chip('ketemu','DITEMUKAN!',[W/2,800],2.75,u,{kind:'paper',dy:0});};
// 6: one empty corner -> which way is up
S[6]=(u,d,t)=>{const rot=lerp(2.2,0,eio(seg(u,1.7,2.9)));qr.rotation.set(0,rot,0);
  camTop(V(0,0,.15),lerp(19,18.3,eio(u/d)),0);
  finders.forEach(f=>ringsOn(f,1,t));
  emptyMark.visible=u>.35;emptyMark.children.forEach(m=>m.material.opacity=seg(u,.35,.7));
  chip('kosong','POJOK KOSONG',Lw(1.4,.2,1.4+3.5*M+.25),.6,u,{kind:'paper',dy:62,until:2.0});
  chip('atas',UP+'ATAS',Lw(0,.2,-HALF+.5),3.0,u,{dy:-6});};
// 7: straighten and read data
S[7]=(u,d,t)=>{const a=1-eio(seg(u,0,1.3));qr.rotation.set(-.35*a,.6*a,.25*a,'XYZ');qr.position.y=.3*a;
  const k=eio(u/d);camOrbit(V(0,0,.2),lerp(.25,-.15,k),lerp(1.05,1.2,k),lerp(18,17.6,k));
  finders.forEach(f=>ringsOn(f,1-seg(u,1.0,1.4)*.6,t));
  const head=lerp(-20,data.length+20,seg(u,1.4,4.1));
  setInst(null,i=>{const dd=head-rank[i];return dd>=0&&dd<26?tmpC.copy(cBlue).lerp(cInk,dd/26):(dd>=26?tmpC.copy(cInk).lerp(cBlue,.12):cInk)});instDirty=true;
  chip('data','DATA',Lw(.6,.3,.9),2.0,u,{dy:-12});};
// 8: any angle works
S[8]=(u,d,t)=>{const k=eio(u/d);qr.rotation.set(-.2*k,u*.55,.12*k,'XYZ');
  camOrbit(V(0,0,.3),.1,lerp(1.3,1.0,k),lerp(17.6,19.6,k));finders.forEach(f=>{ringsOn(f,1,t);lift(f,.25*eo(seg(u,0,.6)))});

function sceneAt(t){for(let i=TL.scenes.length-1;i>=0;i--)if(t>=TL.scenes[i].t0-1e-6)return i;return 0}
