<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const W=720,H=1280;
const BLUE=0x536dff,PAPER=0xf2f0e9,INK=0x171717,LGREY=0xd9d9d5;
const TL=await (await fetch('timeline.json')).json();
await Promise.all([document.fonts.load('700 46px Sora'),document.fonts.load('800 29px Sora'),document.fonts.load('400 23px Inter'),document.fonts.load('500 22px Inter'),document.fonts.load('400 84px "DM Serif Display"')]);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(u,a,b)=>clamp((u-a)/(b-a));

// ---------- renderer ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(INK);scene.fog=new THREE.Fog(INK,10,24);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.6;
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,80);
cam.setViewOffset(W,H,0,150,W,H);

const sun=new THREE.DirectionalLight(0xfff1e0,2.2);sun.position.set(4,9,4.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.025;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xc4ccff,0x1c1c1b,0.4));
const rim=new THREE.DirectionalLight(0xc8d0ff,0.8);rim.position.set(-5,3,-6);scene.add(rim);

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function rngMaker(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
const blueBasic=(op=1)=>new THREE.MeshBasicMaterial({color:BLUE,transparent:true,opacity:op,toneMapped:false,depthWrite:false});

// ---------- materials ----------
const iceMat=new THREE.MeshStandardMaterial({color:0xe4e8ea,roughness:.18,metalness:0,emissive:0x15171a});
const solidMat=new THREE.MeshStandardMaterial({color:0x7c7468,roughness:.65,metalness:.05});
const waterMat=new THREE.MeshStandardMaterial({color:0x2a3248,roughness:.08,metalness:.1,transparent:true,opacity:.62,depthWrite:false});
const oilMat=new THREE.MeshStandardMaterial({color:0x4d473e,roughness:.1,metalness:.1,transparent:true,opacity:.6,depthWrite:false});
const glassMat=new THREE.MeshStandardMaterial({color:PAPER,roughness:.05,metalness:0,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false});
const rimMat=new THREE.MeshStandardMaterial({color:PAPER,roughness:.1,transparent:true,opacity:.45,depthWrite:false});

// ---------- table ----------
const table=new THREE.Mesh(new THREE.PlaneGeometry(40,40).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x222221,roughness:.9}));
table.receiveShadow=true;scene.add(table);

// ---------- glasses ----------
const GR=1.0,GH=2.3,BASE=.12,WH=1.6,IC=.8;
const WTOP=BASE+WH;               // water surface y
const YF=WTOP+IC*.1-IC/2;         // floating ice centre (10% above)
function makeGlass(liqMat){
  const g=new THREE.Group();
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(GR,GR,GH,72,1,true),glassMat);wall.position.y=GH/2;wall.renderOrder=4;g.add(wall);
  const rimM=new THREE.Mesh(new THREE.TorusGeometry(GR,.022,8,72).rotateX(Math.PI/2),rimMat);rimM.position.y=GH;rimM.renderOrder=4;g.add(rimM);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(GR,GR,BASE,72),new THREE.MeshStandardMaterial({color:PAPER,roughness:.1,transparent:true,opacity:.22,depthWrite:false}));base.position.y=BASE/2;base.renderOrder=3;g.add(base);
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(GR*.965,GR*.965,WH,72),liqMat);liq.position.y=BASE+WH/2;liq.renderOrder=2;g.add(liq);
  const line=new THREE.Mesh(new THREE.TorusGeometry(GR*.965,.014,6,96).rotateX(Math.PI/2),blueBasic(.9));line.position.y=WTOP;line.renderOrder=5;g.add(line);
  scene.add(g);return g;}
const glassW=makeGlass(waterMat),glassO=makeGlass(oilMat);
const ice=new THREE.Mesh(new RoundedBoxGeometry(IC,IC,IC,4,.1),iceMat);ice.castShadow=true;scene.add(ice);
const solid=new THREE.Mesh(new RoundedBoxGeometry(IC*.9,IC*.9,IC*.9,4,.08),solidMat);solid.castShadow=true;scene.add(solid);
const ripples=[];for(let k=0;k<3;k++){const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,72).rotateX(-Math.PI/2),blueBasic(1));m.renderOrder=6;scene.add(m);ripples.push(m)}

// ---------- molecules ----------
const molGroup=new THREE.Group();molGroup.position.set(0,1.3,0);scene.add(molGroup);
const oMat=new THREE.MeshStandardMaterial({color:0xd9d9d5,roughness:.35});
const hMat=new THREE.MeshStandardMaterial({color:0x8f8f8a,roughness:.4});
const oGeo=new THREE.SphereGeometry(.2,24,16),hGeo=new THREE.SphereGeometry(.11,16,12);
const A=.8,OH=.27;
const lat=[],holes=[];
for(const [lz,ox] of [[0,0],[-1.15,A/2]]){
  for(let i=-8;i<=8;i++)for(let j=-8;j<=8;j++){
    const x=A*(i+.5*j)+ox,y=A*(Math.sqrt(3)/2)*j;
    const e=(x/2.55)**2+(y/1.95)**2;
    if((((i-j)%3)+3)%3==0){if(lz==0&&e<.8)holes.push(V(x,y,lz));continue}
    if(e<1)lat.push({p:V(x,y,lz),layer:lz==0?0:1});
  }}
// lattice neighbours + H directions
const bonds=[];
lat.forEach((a,i)=>{a.nb=[];lat.forEach((b,j)=>{if(i!==j&&a.layer===b.layer&&a.p.distanceTo(b.p)<A*1.05)a.nb.push(j)})});
lat.forEach((a,i)=>{a.nb.forEach(j=>{if(j>i)bonds.push([i,j])});
  const dirs=a.nb.map(j=>lat[j].p.clone().sub(a.p).normalize());
  // default directions for edge molecules
  while(dirs.length<2){const ang=dirs.length?Math.atan2(dirs[0].y,dirs[0].x)+2.09:1.0;dirs.push(V(Math.cos(ang),Math.sin(ang),0))}
  a.h1=dirs[0].clone().multiplyScalar(OH);a.h2=dirs[1].clone().multiplyScalar(OH);});
// liquid positions: dense random cloud (greedy-matched to lattice)
const rr=rngMaker(11);const liq=[];
while(liq.length<lat.length){const p=V((rr()*2-1)*1.95,(rr()*2-1)*1.5,-rr()*1.35);
  if((p.x/1.95)**2+(p.y/1.5)**2>1)continue;if(liq.every(q=>q.distanceTo(p)>.46))liq.push(p)}
const used=new Array(liq.length).fill(false);
const order=lat.map((a,i)=>i).sort((a,b)=>lat[a].p.length()-lat[b].p.length());
const DEF1=V(Math.sin(.91),Math.cos(.91),0).multiplyScalar(OH),DEF2=V(-Math.sin(.91),Math.cos(.91),0).multiplyScalar(OH);
const mols=[];
order.forEach(i=>{let best=-1,bd=1e9;liq.forEach((q,k)=>{if(!used[k]){const d=q.distanceTo(lat[i].p.clone().multiplyScalar(.75));if(d<bd){bd=d;best=k}}});used[best]=true;lat[i].lq=liq[best]});
lat.forEach((a,i)=>{const g=new THREE.Group();const o=new THREE.Mesh(oGeo,oMat);const h1=new THREE.Mesh(hGeo,hMat),h2=new THREE.Mesh(hGeo,hMat);g.add(o,h1,h2);molGroup.add(g);
  const q0=new THREE.Quaternion().setFromEuler(new THREE.Euler(rr()*6.28,rr()*6.28,rr()*6.28));
  const ax=V(rr()-.5,rr()-.5,rr()-.5).normalize();
  mols.push({g,h1,h2,q0,ax,ph:[rr()*6.28,rr()*6.28,rr()*6.28],sp:.6+rr()*.8})});
const bondMat=blueBasic(1);const bondGeo=new THREE.CylinderGeometry(.03,.03,1,8);
const bondMeshes=bonds.map(([i,j])=>{const m=new THREE.Mesh(bondGeo,bondMat);m.renderOrder=6;molGroup.add(m);return m});
const holeMat=blueBasic(1),holeFill=blueBasic(.16);
const holeMeshes=holes.map(p=>{const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.RingGeometry(.46,.53,6),holeMat));g.add(new THREE.Mesh(new THREE.CircleGeometry(.46,6),holeFill));g.position.copy(p);g.position.z+=.02;g.renderOrder=7;molGroup.add(g);return g});
const tmpQ=new THREE.Quaternion(),tmpQ2=new THREE.Quaternion(),ID_Q=new THREE.Quaternion();
function liquidPose(i,t){const m=mols[i],L=lat[i].lq;
  const p=L.clone().add(V(.07*Math.sin(t*1.7+m.ph[0]),.07*Math.sin(t*1.3+m.ph[1]),.07*Math.sin(t*1.9+m.ph[2])));
  tmpQ.setFromAxisAngle(m.ax,t*m.sp);const q=m.q0.clone().premultiply(tmpQ);return{p,q}}
function setMols(t,k){ // k=0 liquid, 1 lattice
  mols.forEach((m,i)=>{const a=lat[i];const L=liquidPose(i,t);
    m.g.position.lerpVectors(L.p,a.p,k);m.g.quaternion.slerpQuaternions(L.q,ID_Q,k);
    m.h1.position.lerpVectors(DEF1,a.h1,k);m.h2.position.lerpVectors(DEF2,a.h2,k);m.g.visible=true});}
function setBonds(op,grow=1){bondMat.opacity=op;bonds.forEach(([i,j],n)=>{const m=bondMeshes[n];const a=lat[i].p,b=lat[j].p;
  m.position.lerpVectors(a,b,.5);const d=b.clone().sub(a);const L=d.length();m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());m.scale.set(1,Math.max(.001,(L-.42)*grow),1);m.visible=op>0.01})}
const molWorld=(i)=>lat[i].p.clone().add(molGroup.position);
// pick reference molecules near centre (front layer)
const centreIdx=lat.map((a,i)=>i).filter(i=>lat[i].layer===0).sort((a,b)=>lat[a].p.length()-lat[b].p.length());
const refBond=bonds.findIndex(([i,j])=>lat[i].layer===0&&(i===centreIdx[1]||j===centreIdx[1]));
const holeCentre=holes.map((p,i)=>i).sort((a,b)=>holes[a].length()-holes[b].length())[0];

// ---------- iceberg / lake ----------
const sea=new THREE.Mesh(new THREE.BoxGeometry(16,5,7),new THREE.MeshStandardMaterial({color:0x2c3449,roughness:.06,metalness:.15,transparent:true,opacity:.8,depthWrite:false}));sea.position.y=-2.5;sea.renderOrder=3;scene.add(sea);
const seaLine=new THREE.Mesh(new THREE.BoxGeometry(16,.025,.025),new THREE.MeshBasicMaterial({color:BLUE,toneMapped:false}));seaLine.position.set(0,0,3.5);scene.add(seaLine);
const bed=new THREE.Mesh(new THREE.BoxGeometry(16,.4,7),new THREE.MeshStandardMaterial({color:0x1d1d1c,roughness:1}));bed.position.y=-5.2;bed.receiveShadow=true;scene.add(bed);
const BH=3.0;const berg=new THREE.Mesh(new RoundedBoxGeometry(1.7,BH,1.7,4,.16),iceMat);berg.castShadow=true;scene.add(berg);
const bergLine=new THREE.Mesh(new THREE.BoxGeometry(1.86,.03,1.86),new THREE.MeshBasicMaterial({color:BLUE,toneMapped:false}));scene.add(bergLine);
const sheet=new THREE.Mesh(new THREE.BoxGeometry(16.08,1,7.08),iceMat);scene.add(sheet);
const fishMat=new THREE.MeshStandardMaterial({color:0xa7a7a2,roughness:.45,metalness:.1});
function makeFish(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.5,24,16),fishMat);b.scale.set(1,.42,.3);g.add(b);
  const tl=new THREE.Mesh(new THREE.ConeGeometry(.24,.42,4),fishMat);tl.rotation.z=Math.PI/2;tl.position.x=-.6;tl.scale.set(1,1,.35);g.add(tl);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0x171717}));eye.position.set(.32,.06,.13);g.add(eye);
  scene.add(g);return {g,tl}}
const fish=[makeFish(),makeFish(),makeFish()];

// ---------- DOM chips / captions ----------
const ov=document.getElementById('ov'),capEl=document.getElementById('cap'),subEl=document.getElementById('sub'),endEl=document.getElementById('end'),fadeEl=document.getElementById('fade'),capbox=document.getElementById('capbox');
const tagwrap=document.getElementById('tagwrap');
const chipEls={};
const CHECK='<svg width="28" height="28" viewBox="0 0 28 28"><path d="M4 15l7 7L24 6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function chip(id,html,anchor,t0,u,{kind='',dx=0,dy=-8,until=1e9}={}){
  let el=chipEls[id];if(!el){el=document.createElement('div');el.className='chip '+kind;el.innerHTML=html;ov.appendChild(el);chipEls[id]=el}
  const age=u-t0;if(age<0||u>until)return;
  let x,y;if(anchor.isVector3){const v=anchor.clone().project(cam);x=(v.x*.5+.5)*W+dx;y=(-v.y*.5+.5)*H+dy}else{x=anchor[0]+dx;y=anchor[1]+dy}
  el.style.display='block';const w=el.offsetWidth;x=clamp(x,w/2+24,W-w/2-24);
  el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${Math.max(eob(age/.38),0.001)})`;}

// ---------- camera helpers ----------
function camOrbit(tg,az,el,dist){cam.position.set(tg.x+dist*Math.cos(el)*Math.sin(az),tg.y+dist*Math.sin(el),tg.z+dist*Math.cos(el)*Math.cos(az));cam.up.set(0,1,0);cam.lookAt(tg)}
function resetObjs(){
  for(const o of [table,glassW,glassO,ice,solid,molGroup,sea,seaLine,bed,berg,bergLine,sheet,...ripples,...fish.map(f=>f.g)])o.visible=false;
  for(const m of mols)m.g.visible=false;for(const m of bondMeshes)m.visible=false;for(const h of holeMeshes)h.visible=false;
  glassW.position.set(0,0,0);glassO.position.set(0,0,0);
  ice.position.set(0,YF,0);ice.rotation.set(0,0,0);solid.position.set(0,0,0);solid.rotation.set(0,0,0);
  scene.fog.near=10;scene.fog.far=24;
  for(const e of Object.values(chipEls))e.style.display='none';
}
const bob=(t)=>.025*Math.sin(t*2.3);
function floatIce(x,t){ice.visible=true;ice.position.set(x,YF+bob(t),0);ice.rotation.set(.04*Math.sin(t*1.7),.3+t*.12,.04*Math.sin(t*1.3+1))}
function ripple(x,u,ti){for(let k=0;k<3;k++){const m=ripples[k];const a=u-ti-k*.22;if(a<0||a>1.3)continue;m.visible=true;const s=.12+eo(a/1.3)*.82;m.scale.set(s,1,s);m.position.set(x,WTOP+.004,0);m.material.opacity=(1-a/1.3)*.9}}

// ---------- scenes ----------
const S=[];
// 0: drop an ice cube in
const TI=.74;
S[0]=(u,d,t)=>{table.visible=glassW.visible=true;ice.visible=true;
  let y,rx;if(u<TI){const f=Math.max(0,u-.15);y=4.3-.5*15.9*f*f;rx=(1-u/TI)*.9}else{const tau=u-TI;y=YF-.38*Math.exp(-3.2*tau)*Math.sin(7*tau);rx=.12*Math.exp(-3*tau)*Math.sin(6*tau)}
  ice.position.set(0,y,0);ice.rotation.set(rx,.3+u*.12,rx*.5);ripple(0,u,TI);
  const k=eio(u/d);camOrbit(V(0,1.3,0),lerp(.55,.25,k),lerp(.36,.26,k),lerp(9.4,8.8,k));};
// 1: it floats - why?
S[1]=(u,d,t)=>{table.visible=glassW.visible=true;floatIce(0,t);
  const k=eio(u/d);camOrbit(V(0,1.35,0),lerp(.25,-.25,k),lerp(.26,.4,k),lerp(8.8,8.1,k));
  chip('apung','MENGAPUNG',V(0,YF+.45,0),.35,u,{kind:'paper',dy:-14,until:1.75});
  chip('kenapa','KENAPA?',V(0,YF+.45,0),1.85,u,{dy:-14});};
// 2: most solids sink
S[2]=(u,d,t)=>{table.visible=glassO.visible=true;solid.visible=true;
  const s=eio(seg(u,.3,2.8));solid.position.set(0,lerp(WTOP+.3,BASE+IC*.45,s)+(u<.3?0:0),0);solid.rotation.set(0,.4+s*.5,lerp(.25,0,s));
  ripple(0,u,.15);
  const k=eio(u/d);camOrbit(V(0,1.3,0),lerp(-.4,.15,k),lerp(.34,.24,k),lerp(8.6,9.2,k));
  chip('padat','PADAT',V(0,solid.position.y+.45,0),.5,u,{kind:'paper',dy:-10,until:2.6});
  chip('tenggelam','TENGGELAM',V(0,BASE+IC*.9,0),2.7,u,{dy:-10});
  chip('kebanyakan','KEBANYAKAN ZAT',[W/2,800],1.3,u,{kind:'paper',dy:0});};
// 3: water is the exception
S[3]=(u,d,t)=>{table.visible=glassO.visible=glassW.visible=true;solid.visible=true;
  glassO.position.x=-1.25;glassW.position.x=1.25;solid.position.set(-1.25,BASE+IC*.45,0);solid.rotation.set(0,.9,0);floatIce(1.25,t);
  const k=eio(u/d);camOrbit(V(0,1.3,0),lerp(.12,-.08,k),.3,lerp(12.8,12.2,k));
  chip('lain','ZAT LAIN',V(-1.25,BASE+IC*.9,0),.25,u,{kind:'paper',dy:-10});
  chip('air',CHECK+'AIR',V(1.25,YF+.45,0),.55,u,{dy:-12});
  chip('beda','PENGECUALIAN',[W/2,800],1.0,u,{kind:'paper',dy:0});};
// 4: liquid: molecules tumble, packed
S[4]=(u,d,t)=>{molGroup.visible=true;setMols(t,0);
  const k=eio(u/d);camOrbit(V(0,1.3,-.6),lerp(-.35,.1,k),lerp(.12,.06,k),lerp(13.6,14.4,k));
  chip('mol','MOLEKUL AIR',molWorld(centreIdx[0]).clone().lerp(lat[centreIdx[0]].lq.clone().add(molGroup.position),1),.5,u,{kind:'paper',dy:-26,until:2.4});
  chip('rapat','CAIR = RAPAT',[W/2,800],2.5,u,{kind:'paper',dy:0});};
// 5: freezing -> hexagonal lattice
S[5]=(u,d,t)=>{molGroup.visible=true;const k=eio(seg(u,.35,2.6));setMols(t,k);setBonds(seg(u,2.2,2.9),eo(seg(u,2.2,3.0)));
  const kc=eio(u/d);camOrbit(V(0,1.3,-.6),lerp(.1,0,kc),lerp(.06,0,kc),lerp(14.4,15.2,kc));
  const [bi,bj]=bonds[refBond];
  chip('beku','MEMBEKU',[W/2,800],.4,u,{kind:'paper',dy:0,until:3.0});
  chip('hb','IKATAN HIDROGEN',lat[bi].p.clone().lerp(lat[bj].p,.5).add(molGroup.position),2.9,u,{dy:-14});
  chip('hex','KISI SEGI ENAM',[W/2,800],3.3,u,{kind:'paper',dy:0});};
// 6: empty space, ~9% less dense
S[6]=(u,d,t)=>{molGroup.visible=true;setMols(t,1);setBonds(1);
  holeMeshes.forEach((h,n)=>{const dd=holes[n].length();const a=u-(.25+dd*.22);if(a<0)return;h.visible=true;const s=Math.max(.001,eo(a/.4));h.scale.set(s,s,s)});
  holeMat.opacity=1;
  const kc=eio(u/d);camOrbit(V(0,1.3,-.6),lerp(0,.18,kc),lerp(0,.08,kc),lerp(15.2,14.6,kc));
  chip('kosong','RUANG KOSONG',holes[holeCentre].clone().add(molGroup.position),.9,u,{dy:-36,until:2.3});
  chip('9','±9% KURANG RAPAT',[W/2,800],2.4,u,{kind:'paper',dy:0});};
// 7: 90% hidden below
S[7]=(u,d,t)=>{sea.visible=seaLine.visible=bed.visible=berg.visible=bergLine.visible=true;scene.fog.near=14;scene.fog.far=34;
  const yb=BH*.1-BH/2+.02*Math.sin(t*1.6);berg.position.set(0,yb,0);berg.rotation.set(0,.5+u*.04,0);bergLine.position.set(0,0,0);bergLine.rotation.y=.5+u*.04;
  const k=eio(u/d);camOrbit(V(0,-1.3,0),lerp(.35,-.1,k),lerp(.16,.1,k),lerp(12.6,11.8,k));
  chip('10','±10% DI ATAS',V(.95,.15,0),.7,u,{kind:'paper',dy:-6,dx:60});
  chip('90','±90% DI BAWAH',V(.95,-1.4,0),2.0,u,{dy:-6,dx:60});};
// 8: lakes freeze from the top, fish survive
S[8]=(u,d,t)=>{sea.visible=bed.visible=sheet.visible=true;scene.fog.near=14;scene.fog.far=34;
  const th=lerp(.08,.42,eo(seg(u,.2,2.2)));sheet.scale.set(1,th,1);sheet.position.y=.06-th/2;
  [[-2.2,-2.1,.0,1],[1.6,-3.0,-.8,-1],[.2,-3.9,.6,1]].forEach(([x0,y,z,dir],n)=>{const f=fish[n];f.g.visible=true;const x=x0+dir*u*.35;f.g.position.set(x,y+.08*Math.sin(t*2+n),z);f.g.rotation.y=dir>0?0:Math.PI;f.tl.rotation.y=.35*Math.sin(t*7+n)});
  const k=eio(u/d);camOrbit(V(0,-1.55,0),lerp(-.2,.15,k),lerp(.1,.06,k),lerp(13.4,12.6,k));
  chip('atas','MEMBEKU DARI ATAS',[W/2,800],.4,u,{kind:'paper',dy:0});
  chip('ikan','IKAN BERTAHAN',V(-2.2+u*.35,-1.75,0),2.3,u,{dy:-8});};
// 9: end card
S[9]=(u,d,t)=>{table.visible=glassW.visible=true;floatIce(0,t);camOrbit(V(0,1.3,0),.3+u*.35,.32,9.6);};

// ---------- frame ----------
function sceneAt(t){for(let i=TL.scenes.length-1;i>=0;i--)if(t>=TL.scenes[i].t0-1e-6)return i;return 0}
const LAST=TL.scenes.length-1;
window.setT=(t)=>{
  const i=sceneAt(t),sc=TL.scenes[i],u=t-sc.t0,d=sc.t1-sc.t0;
  resetObjs();
  S[i](u,d,t);
  cam.updateMatrixWorld(true);scene.updateMatrixWorld(true);
  S[i](u,d,t); // second pass so chips project with the final camera
  if(i<LAST){capbox.style.display='block';endEl.style.display='none';
    const words=sc.id.split(' ');const tot=sc.id.length;let acc=0;const p=clamp((t-sc.start)/sc.dur);
    capEl.innerHTML=words.map(w=>{const on=t>=sc.start&&acc/tot<=p+.001;acc+=w.length+1;return `<span class="${on?'':'off'}">${w}</span>`}).join(' ');
    subEl.textContent=sc.en;}
  else{capbox.style.display='none';endEl.style.display='block';const a=eo(seg(u,.15,.75));tagwrap.style.opacity=a;tagwrap.style.transform=`translateY(${(1-a)*24}px)`;}
  const fin=1-clamp(t/.35),fout=clamp((t-(TL.total-.6))/.6);fadeEl.style.opacity=Math.max(fin,fout);
  renderer.render(scene,cam);
};
window.__r=renderer;
window.READY=true;
</script>
